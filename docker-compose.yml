services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hason
      POSTGRES_PASSWORD: hason
      POSTGRES_DB: hason
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  postgres-test:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hason
      POSTGRES_PASSWORD: hason
      POSTGRES_DB: hason_test
    ports:
      - '5433:5432'

volumes:
  pgdata:
