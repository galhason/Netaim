name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

env:
  # Values exist only so the build and the environment assertion can run.
  # Nothing here reaches a real system.
  PAYLOAD_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
  NEXT_PUBLIC_SERVER_URL: http://localhost:3000
  DATABASE_URL: postgres://hason:hason@localhost:5432/hason

jobs:
  gates:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hason
          POSTGRES_PASSWORD: hason
          POSTGRES_DB: hason
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-test:
        image: postgres:16
        env:
          POSTGRES_USER: hason
          POSTGRES_PASSWORD: hason
          POSTGRES_DB: hason_test
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate types
        run: npm run generate:types

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # The isolation gate proves organization scoping against a real
      # database. CI=true makes its availability check fail rather than
      # let the suite skip in silence.
      - name: Isolation gate
        run: npx vitest run tests/integration
        env:
          CI: 'true'
          TEST_DATABASE_URL: postgres://hason:hason@localhost:5433/hason_test
          PAYLOAD_DB_PUSH: 'true'

      - name: Build
        run: npm run build
